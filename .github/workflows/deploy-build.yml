name: Build and publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JeryMotro_WEB
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and SSG
        working-directory: artifacts/jerymotro
        run: pnpm run build
        env:
          PRERENDER_BASE_URL: https://jerymotro.duckdns.org
          VITE_SITE_URL: https://jerymotro.duckdns.org

      - name: Checkout redirect-jeridmotro
        uses: actions/checkout@v4
        with:
          repository: TkAbeleon/redirect-jeridmotro
          token: ${{ secrets.REDIRECT_REPO_TOKEN }}
          path: target
          fetch-depth: 1

      - name: Publish dist/public to redirect-jeridmotro
        working-directory: target
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../artifacts/jerymotro/dist/public/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi

          git commit -m "chore: publish JeryMotro production build"
          git push origin HEAD:main
