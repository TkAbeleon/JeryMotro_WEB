name: Build and publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jerymotro-production-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JeryMotro_WEB
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and SSG
        working-directory: artifacts/jerymotro
        run: pnpm run build
        env:
          PRERENDER_BASE_URL: https://jerymotro.duckdns.org
          VITE_SITE_URL: https://jerymotro.duckdns.org
          VITE_API_URL: https://rtsikynyantsa-n8n-tk.hf.space

      - name: Checkout redirect-jeridmotro
        uses: actions/checkout@v4
        with:
          repository: TkAbeleon/redirect-jeridmotro
          token: ${{ secrets.REDIRECT_REPO_TOKEN }}
          path: target
          fetch-depth: 1

      - name: Publish dist/public to redirect-jeridmotro
        working-directory: target
        run: |
          set -euo pipefail

          publish_attempt=1
          while [ "$publish_attempt" -le 3 ]; do
            echo "Publication attempt $publish_attempt/3"

            git fetch origin main
            git reset --hard origin/main

            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a ../artifacts/jerymotro/dist/public/. .

            printf '%s\n' \
              '{' \
              '  "rewrites": [' \
              '    {' \
              '      "source": "/((?!assets/|.*\\.(?:js|mjs|css|map|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|json)$).*)",' \
              '      "destination": "/index.html"' \
              '    }' \
              '  ],' \
              '  "headers": [' \
              '    {' \
              '      "source": "/assets/(.*)",' \
              '      "headers": [' \
              '        {' \
              '          "key": "Cache-Control",' \
              '          "value": "public, max-age=31536000, immutable"' \
              '        }' \
              '      ]' \
              '    },' \
              '    {' \
              '      "source": "/index.html",' \
              '      "headers": [' \
              '        {' \
              '          "key": "Cache-Control",' \
              '          "value": "no-store, no-cache, must-revalidate"' \
              '        }' \
              '      ]' \
              '    }' \
              '  ]' \
              '}' > vercel.json

            printf '%s\n' \
              '{' \
              '  "$schema": "https://developers.cloudflare.com/workers/wrangler/config-schema.json",' \
              '  "name": "jerymotro",' \
              '  "compatibility_date": "2026-09-03",' \
              '  "assets": {' \
              '    "directory": ".", ' \
              '    "not_found_handling": "single-page-application"' \
              '  }' \
              '}' > wrangler.jsonc

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A
            if git diff --cached --quiet; then
              echo "No generated changes to publish."
              exit 0
            fi

            git commit -m "chore: publish JeryMotro production build"

            if git push origin HEAD:main; then
              echo "Production build published successfully."
              exit 0
            fi

            echo "Remote main advanced during publication; refreshing and retrying..."
            publish_attempt=$((publish_attempt + 1))
          done

          echo "Failed to publish after 3 attempts."
          exit 1
