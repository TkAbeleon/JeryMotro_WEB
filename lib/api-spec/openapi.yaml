openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 2.4.0
  description: JeryMotro Platform API — Surveillance des feux de brousse à Madagascar
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication & user management
  - name: detections
    description: FIRMS fire detections
  - name: clusters
    description: Fire event clusters
  - name: predictions
    description: ML risk predictions
  - name: alerts
    description: Alert history and subscriptions
  - name: zones
    description: Priority monitored zones (Premium)
  - name: chat
    description: JeryMotro AI (RAG)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new standard user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "409":
          description: Email already exists

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Delete current user account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No content

  /auth/me/profile:
    put:
      operationId: updateProfile
      tags: [auth]
      summary: Update profile info
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /auth/me/contacts:
    put:
      operationId: updateContacts
      tags: [auth]
      summary: Update alert contacts (Premium)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: OK

  /auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OK

  /auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP code and get token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"

  /detections:
    get:
      operationId: listDetections
      tags: [detections]
      summary: List fire detections with filters
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
        - name: min_frp
          in: query
          schema:
            type: ["number", "null"]
        - name: max_frp
          in: query
          schema:
            type: ["number", "null"]
        - name: min_risk
          in: query
          schema:
            type: ["number", "null"]
        - name: max_risk
          in: query
          schema:
            type: ["number", "null"]
        - name: source
          in: query
          schema:
            type: ["string", "null"]
        - name: region
          in: query
          schema:
            type: ["string", "null"]
        - name: exclude_noise
          in: query
          schema:
            type: ["boolean", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionList"

  /detections/stats/environment/advanced:
    get:
      operationId: getAdvancedEnvironmentalStats
      tags: [detections]
      summary: Advanced environmental statistics
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: environment
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: exclude_noise
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Advanced environmental statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentalAdvancedStatsResponse"
        "422":
          description: Invalid date range

  /detections/stats/environment:
    get:
      operationId: getEnvironmentalContextStats
      tags: [detections]
      summary: Daily environmental context distribution
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
        - name: exclude_noise
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentalContextStatsResponse"

  /detections/{id}:
    get:
      operationId: getDetection
      tags: [detections]
      summary: Get a detection by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detection"
        "404":
          description: Not found

  /detections/stats/daily:
    get:
      operationId: getDailyStats
      tags: [detections]
      summary: Daily detection statistics
      parameters:
        - name: date_from
          in: query
          schema:
            type: ["string", "null"]
        - name: date_to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyStatsResponse"

  /clusters:
    get:
      operationId: listClusters
      tags: [clusters]
      summary: List fire event clusters
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: region
          in: query
          schema:
            type: ["string", "null"]
        - name: active_only
          in: query
          schema:
            type: ["boolean", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterList"

  /clusters/{id}/detections:
    get:
      operationId: getClusterDetections
      tags: [clusters]
      summary: Get detections belonging to a cluster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDetections"
        "404":
          description: Not found

  /predictions:
    get:
      operationId: listPredictions
      tags: [predictions]
      summary: List ML predictions
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
        - name: region
          in: query
          schema:
            type: ["string", "null"]
        - name: min_risk
          in: query
          schema:
            type: ["number", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionList"

  /predictions/risk-map:
    get:
      operationId: getRiskMap
      tags: [predictions]
      summary: Get GeoJSON risk map for J+1
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
        - name: min_risk
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskMapResponse"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts history
      security:
        - bearerAuth: []
      parameters:
        - name: level
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: channel
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"

  /alerts/subscribe:
    post:
      operationId: subscribeAlert
      tags: [alerts]
      summary: Subscribe to alerts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertSubscription"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "403":
          description: Premium required for WhatsApp/SMS

  /alerts/me:
    get:
      operationId: getMyAlerts
      tags: [alerts]
      summary: Get personal alerts and subscriptions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"

  /alerts/subscriptions:
    get:
      operationId: getMySubscriptions
      tags: [alerts]
      summary: Get active alert subscriptions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"

  /alerts/trigger:
    post:
      operationId: triggerAlert
      tags: [alerts]
      summary: Manually trigger an alert (Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertTrigger"
      responses:
        "201":
          description: Created
        "403":
          description: Admin only

  /alerts/subscribe/{id}:
    delete:
      operationId: deleteSubscription
      tags: [alerts]
      summary: Delete an alert subscription
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /alerts/subscriptions/{id}/verify:
    post:
      operationId: verifySubscription
      tags: [alerts]
      summary: Verify a subscription with OTP code
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          description: Bad Request
        "404":
          description: Subscription not found

  /alerts/subscriptions/{id}/resend:
    post:
      operationId: resendVerificationCode
      tags: [alerts]
      summary: Resend verification OTP code
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: Subscription not found

  /zones:
    get:
      operationId: listZones
      tags: [zones]
      summary: List monitored priority zones (Premium)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"
    post:
      operationId: createZone
      tags: [zones]
      summary: Create a priority zone (Premium)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "403":
          description: Premium only

  /zones/{id}:
    delete:
      operationId: deleteZone
      tags: [zones]
      summary: Delete a priority zone (Premium)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /chat:
    post:
      operationId: chatWithAI
      tags: [chat]
      summary: Chat with JeryMotro AI (RAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [detections]
      summary: Dashboard overview stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        version:
          type: ["string", "null"]
        uptime_seconds:
          type: ["number", "null"]
      required:
        - status

    UserRegistration:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        full_name:
          type: ["string", "null"]
        organization:
          type: ["string", "null"]

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    UserProfile:
      type: object
      required: [id, email, role, is_active]
      properties:
        id:
          type: integer
        email:
          type: string
        full_name:
          type: ["string", "null"]
        organization:
          type: ["string", "null"]
        role:
          type: string
        is_active:
          type: boolean
        phone_number:
          type: ["string", "null"]
        whatsapp_number:
          type: ["string", "null"]

    AuthToken:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    ProfileUpdate:
      type: object
      properties:
        full_name:
          type: ["string", "null"]
        organization:
          type: ["string", "null"]

    ContactUpdate:
      type: object
      properties:
        phone_number:
          type: ["string", "null"]
        whatsapp_number:
          type: ["string", "null"]

    OtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
        via:
          type: ["string", "null"]

    OtpVerify:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
        code:
          type: string

    Detection:
      type: object
      required: [id, latitude, longitude, source, acq_date]
      properties:
        id:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
        brightness:
          type: ["number", "null"]
        frp:
          type: ["number", "null"]
        frp_log:
          type: ["number", "null"]
        confidence:
          type: ["string", "null"]
        confidence_num:
          type: ["integer", "null"]
        acq_date:
          type: string
        acq_time:
          type: ["string", "null"]
        local_hour:
          type: ["integer", "null"]
        satellite:
          type: ["string", "null"]
        instrument:
          type: ["string", "null"]
        daynight:
          type: ["string", "null"]
        source:
          type: string
        risk_score:
          type: ["number", "null"]
        fire_label:
          type: ["integer", "null"]
        cluster_id:
          type: ["integer", "null"]
        cluster_size:
          type: ["integer", "null"]
        cluster_frp_total:
          type: ["number", "null"]
        cluster_frp_max:
          type: ["number", "null"]
        is_noise:
          type: ["integer", "null"]
        is_dry_season:
          type: ["boolean", "null"]
        temperature_2m:
          type: ["number", "null"]
        relative_humidity:
          type: ["number", "null"]
        wind_speed:
          type: ["number", "null"]
        landcover:
          type: ["string", "null"]
        fire_context_type:
          type: ["string", "null"]
          description: Classe WorldCover dominante autour de la détection, issue de l'enrichissement asynchrone Google Earth Engine.
        context_percentages:
          type: ["object", "null"]
          additionalProperties:
            type: number
          description: Répartition en pourcentage des classes WorldCover autour de la détection.
        ndvi_10m:
          type: ["number", "null"]
        region:
          type: ["string", "null"]
        inserted_at:
          type: ["string", "null"]

    DetectionList:
      type: object
      required: [detections, count, total, limit, offset]
      properties:
        detections:
          type: array
          items:
            $ref: "#/components/schemas/Detection"
        count:
          type: integer
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        filters_applied:
          type: object
          additionalProperties: true

    DailyStats:
      type: object
      required: [date, total_detections, high_risk_count, active_clusters, regions_affected]
      properties:
        date:
          type: string
        total_detections:
          type: integer
        high_risk_count:
          type: integer
        avg_frp:
          type: ["number", "null"]
        max_frp:
          type: ["number", "null"]
        active_clusters:
          type: integer
        regions_affected:
          type: array
          items:
            type: string

    DailyStatsResponse:
      type: object
      required: [stats]
      properties:
        stats:
          type: array
          items:
            $ref: "#/components/schemas/DailyStats"

    EnvironmentalContextDistributionItem:
      type: object
      required: [context, detections, percentage]
      properties:
        context:
          type: string
        detections:
          type: integer
        percentage:
          type: number

    EnvironmentalStatsFilters:
      type: object
      required: [date_from, date_to, exclude_noise]
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        environment:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        exclude_noise:
          type: boolean
          default: true

    EnvironmentalStatsSummary:
      type: object
      required:
        - total_detections
        - enriched_detections
        - pending_detections
        - environmental_coverage_percent
        - total_regions
        - total_sources
        - total_satellites
        - total_instruments
        - total_clusters
        - total_fire_events
        - total_collection_runs
        - total_frp
        - total_frp_valid_detections
        - critical_detections
        - high_risk_detections
        - medium_risk_detections
        - low_risk_detections
        - unknown_risk_detections
        - daytime_detections
        - nighttime_detections
        - dry_season_detections
        - recent_loss_detections
      properties:
        total_detections: {type: integer}
        enriched_detections: {type: integer}
        pending_detections: {type: integer}
        environmental_coverage_percent: {type: number}
        total_regions: {type: integer}
        total_sources: {type: integer}
        total_satellites: {type: integer}
        total_instruments: {type: integer}
        total_clusters: {type: integer}
        total_fire_events: {type: integer}
        total_collection_runs: {type: integer}
        total_frp: {type: number}
        total_frp_valid_detections: {type: integer}
        average_frp: {type: ["number", "null"]}
        median_frp: {type: ["number", "null"]}
        average_risk: {type: ["number", "null"]}
        median_risk: {type: ["number", "null"]}
        critical_detections: {type: integer}
        high_risk_detections: {type: integer}
        medium_risk_detections: {type: integer}
        low_risk_detections: {type: integer}
        unknown_risk_detections: {type: integer}
        daytime_detections: {type: integer}
        nighttime_detections: {type: integer}
        dry_season_detections: {type: integer}
        recent_loss_detections: {type: integer}

    EnvironmentalStatsNumeric:
      type: object
      required: [field, valid_count, missing_count, missing_percentage]
      properties:
        field: {type: string}
        valid_count: {type: integer}
        missing_count: {type: integer}
        missing_percentage: {type: number}
        total: {type: ["number", "null"]}
        mean: {type: ["number", "null"]}
        median: {type: ["number", "null"]}
        variance: {type: ["number", "null"]}
        std_dev: {type: ["number", "null"]}
        min: {type: ["number", "null"]}
        p05: {type: ["number", "null"]}
        q1: {type: ["number", "null"]}
        q3: {type: ["number", "null"]}
        p95: {type: ["number", "null"]}
        iqr: {type: ["number", "null"]}
        max: {type: ["number", "null"]}
        coefficient_of_variation_percent: {type: ["number", "null"]}
        skewness: {type: ["number", "null"]}
        kurtosis: {type: ["number", "null"]}
        outlier_count: {type: integer}
        outlier_percentage: {type: number}

    EnvironmentalStatsNullRow:
      type: object
      required: [field, total_count, non_null_count, null_count, null_percentage]
      properties:
        field: {type: string}
        total_count: {type: integer}
        non_null_count: {type: integer}
        null_count: {type: integer}
        null_percentage: {type: number}

    EnvironmentalStatsDistributionRow:
      type: object
      required: [dimension, is_null, detections, percentage]
      properties:
        dimension: {type: string}
        value: {type: ["string", "null"]}
        is_null: {type: boolean}
        detections: {type: integer}
        percentage: {type: number}
        enriched_detections: {type: integer}
        enriched_percentage: {type: number}
        total_frp: {type: number}
